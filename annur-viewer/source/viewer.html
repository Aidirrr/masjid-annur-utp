<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5ef">
<title>Masjid An-Nur UTP · 3D model</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px "Helvetica Neue",Arial,sans-serif;color:#20342e;background:#f6f5ef}main{height:100%;height:100dvh;display:grid;grid-template-rows:60px minmax(0,1fr) auto}
header,footer{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.5vw,60px);gap:16px}header{border-bottom:1px solid #cfdbd4;background:#fcfcf7}
.brand,.location,.buttons,.download,.view-label,.hint{display:flex;align-items:center}.brand{gap:11px;font-size:14px;font-weight:650;letter-spacing:-.015em}.brand svg{width:33px;height:33px;color:#326052}.brand small{border-left:1px solid #ccd2c8;padding-left:13px;margin-left:3px;font-weight:450;font-size:13px;color:#5b6b62}
button,select{font:inherit;color:inherit;cursor:pointer}button{border:none;background:none}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid #d7a148;outline-offset:-3px}.download{border:1px solid #bcc8bf;border-radius:6px;padding:8px 13px;gap:8px;font-size:12px;font-weight:600;background:#fffefa}.download:hover{background:#e9eee7}svg.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.stage{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(#9abfcf,#d5e1d3 51%,#729d91 52%,#648d80)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.buttons,.hint{position:absolute;bottom:20px;background:rgba(249,250,244,.94);backdrop-filter:blur(12px);box-shadow:0 2px 14px #182b2514;border:1px solid #ffffff85}.buttons{right:clamp(14px,2vw,36px);border-radius:9px;padding:4px;gap:2px}.buttons button{width:38px;height:36px;border-radius:5px;display:grid;place-items:center}.buttons button:hover,.buttons button:active{background:#dce6dc}.divider{height:19px;width:1px;background:#cad2c9;margin:0 3px}.hint{left:clamp(14px,2vw,36px);gap:9px;padding:9px 13px;border-radius:6px;color:#32483d;font-size:12px}.hint svg{width:16px;height:16px}.touch{display:none}footer{min-height:104px;padding-top:17px;padding-bottom:17px;border-top:1px solid #d5dace}.title h1{font:normal clamp(27px,3.1vw,43px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:0 0 8px}.location{color:#53685c;gap:6px;font-size:12px}.location svg{height:14px;width:14px}.view-label{gap:10px;color:#56665c;font-size:12px}.select{position:relative;display:flex;align-items:center}.select svg{position:absolute;right:9px;pointer-events:none;width:14px}.select select{appearance:none;background:#fffefa;padding:9px 32px 9px 12px;border:1px solid #c7cec1;border-radius:5px;font-weight:550;font-size:13px}.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fafbf6ed;border-radius:10px;padding:16px 20px;text-align:center;max-width:90%;box-shadow:0 4px 20px #20342e20}.status:empty{display:none}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(pointer:coarse){.mouse{display:none}.touch{display:inline}}@media(max-width:650px){main{grid-template-rows:54px minmax(0,1fr) auto}.brand{gap:7px}.brand small{display:none}.download{padding:7px 10px}.hint{left:12px;bottom:12px;padding:7px 9px;font-size:10px;max-width:48%;gap:5px}.buttons{right:12px;bottom:12px;padding:2px}.buttons button{width:31px;height:32px}.divider{margin:0 1px}footer{min-height:94px;gap:8px}.view-label{flex-direction:column;align-items:flex-start;gap:4px;font-size:10px}.location{max-width:225px;font-size:10px;line-height:1.3}.select select{font-size:12px;padding:7px 27px 7px 8px}}@media(max-height:440px){main{grid-template-rows:42px minmax(0,1fr) 60px}footer{min-height:60px;padding-top:4px;padding-bottom:4px}.title h1{font-size:23px;margin-bottom:2px}.buttons,.hint{bottom:8px}}
.scene-options{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.scene-options .view-label{flex-direction:column;align-items:flex-start;gap:5px}
.rotation{display:flex;align-items:center;gap:7px;min-height:36px;font-size:13px;cursor:pointer;white-space:nowrap}
.rotation input{accent-color:#356454;width:17px;height:17px;margin:0}
@media(max-width:700px){footer{flex-wrap:wrap;align-content:center;gap:9px 16px;padding-block:10px}.scene-options{gap:12px}.rotation{font-size:12px;min-height:32px}}
@media(max-width:460px){footer .title{width:100%}.scene-options{width:100%;justify-content:space-between}}
@media(max-height:440px){main{grid-template-rows:42px minmax(0,1fr) auto}.scene-options{gap:8px}}
.walk-controls[hidden],.walk-help[hidden]{display:none}.walk-controls{display:flex;gap:4px;touch-action:none}.walk-controls button{min-width:42px;min-height:42px}.walk-controls,.walk-help{position:absolute;left:16px;background:#fafbf4ed;border-radius:7px;padding:4px}.walk-controls{bottom:48px}.walk-help{bottom:15px;padding:7px;font-size:12px}.stage:has(.walk-help:not([hidden])) .hint{display:none}@media(max-width:650px){.scene-options{justify-content:flex-start}.walk-help{max-width:47%}}
.activity-bar{position:absolute;top:12px;left:12px;right:auto;max-width:calc(100% - 24px);display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:6px 10px;background:#fafbf4ed;border-radius:7px;font-size:12px}.activity-bar select,.activity-bar button{padding:6px;border:1px solid #bdc7bf;border-radius:4px;background:#fffefa}.walk-controls .rotation{padding-inline:6px}
</style>
</head>
<body>
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
<symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 1.5 5.7M4 5v6h6"/></symbol>
<symbol id="full" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></symbol>
<symbol id="orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><ellipse cx="12" cy="12" rx="11" ry="5" transform="rotate(-30 12 12)"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M19 9c0 6-7 12-7 12S5 15 5 9a7 7 0 1 1 14 0z"/><circle cx="12" cy="9" r="2.3"/></symbol><symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>
<main id="app"><header><div class="brand"><svg aria-hidden="true" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"><path d="M3 31h30M6 28V18h24v10M8 18c1-3 4-3 5-6h10c1 3 4 3 5 6M13 12c0-4 2-6 5-8 3 2 5 4 5 8zm5-8V1M9 15.5h18M12 21v7m6-7v7m6-7v7"/></svg><span>An-Nur</span><small>Architectural model</small></div><button class="download" id="export"><svg class="ico"><use href="#download"/></svg>Download GLB</button></header>
<section class="stage" aria-label="Interactive mosque model"><canvas id="scene" tabindex="0" aria-label="3D model of Masjid An-Nur. Drag or use the arrow keys to orbit. Scroll or use plus and minus to zoom. Press Home to reset."></canvas><div class="status" role="status" id="status">Loading the model…</div>
<div class="activity-bar viz-controls">
 <label>Scene <select class="form-select" id="activity" disabled><option value="daily">Everyday</option><option value="friday">Jumu’ah · Friday prayer</option></select></label>
 <label id="phaseControls" hidden>Phase <select class="form-select" id="phase"><option value="0">Arrival</option><option value="1">Wudu</option><option value="2">Khutbah</option><option value="3">Prayer</option></select></label>
 <button type="button" class="btn" id="feed" disabled>Feed fish</button>
</div><div class="walk-controls" id="walkPad" hidden><button type="button" class="btn" id="move-a" aria-label="Step left">←</button><button type="button" class="btn" id="move-w" aria-label="Walk forward">↑</button><button type="button" class="btn" id="move-s" aria-label="Walk backward">↓</button><button type="button" class="btn" id="move-d" aria-label="Step right">→</button><label class="rotation form-check"><input type="checkbox" id="fast"> Sprint</label></div><span class="walk-help" id="walkHint" hidden>WASD to walk · Shift to sprint · Drag to look</span><div class="hint"><svg class="ico"><use href="#orbit"/></svg><span class="mouse">Drag to orbit · Scroll to zoom</span><span class="touch">Drag to orbit · Pinch to zoom</span></div>
<div class="buttons" role="group" aria-label="Camera controls"><button id="out" aria-label="Zoom out" title="Zoom out (−)"><svg class="ico"><use href="#minus"/></svg></button><button id="in" aria-label="Zoom in" title="Zoom in (+)"><svg class="ico"><use href="#plus"/></svg></button><span class="divider"></span><button id="reset" aria-label="Reset view" title="Reset view (Home)"><svg class="ico"><use href="#home"/></svg></button><button id="expand" aria-label="Enter fullscreen" title="Enter fullscreen"><svg class="ico"><use href="#full"/></svg></button></div></section>
<footer><div class="title"><h1>Masjid An-Nur</h1><div class="location"><svg class="ico"><use href="#pin"/></svg>Universiti Teknologi PETRONAS · Seri Iskandar, Perak</div></div>
<div class="scene-options">
<label class="rotation form-check"><input type="checkbox" id="walk"> First person</label>
  <label class="rotation"><input type="checkbox" id="rotate">Auto-rotate</label>
  <label class="view-label" for="lighting">Lighting <span class="select"><select id="lighting"><option value="live" id="liveTime" selected>Live · Seri Iskandar</option><option value="day">Daytime</option><option value="night">Night</option><option value="morning">Morning</option><option value="sunrise">Sunrise</option><option value="sunset">Sunset</option></select><svg class="ico"><use href="#down"/></svg></span></label>
  <label class="view-label" for="preset">Viewpoint <span class="select"><select id="preset"><option value="lake">Lakeside</option><option value="waterside">Waterline</option><option value="street">Street portal</option><option value="qibla">Mihrab and minbar</option><option value="gallery">Rear gallery</option><option value="arrivals">Entrance approach</option><option value="gathering">Main hall rows</option><option value="aerial">Aerial</option><option value="court">Courtyard</option><option value="roofbirds">Roof birds</option><option value="dome">Dome detail</option><option value="hall">Inside mosque</option><option value="prayer">Prayer close-up</option><option value="wudu">Wudu area</option><option value="halaqah">Halaqah</option><option value="feeding">Fish feeding</option><option value="custom" hidden>Custom view</option></select><svg class="ico"><use href="#down"/></svg></span></label>
</div></footer></main>
<script id="arch" type="application/octet-stream">__ARCH_DATA__</script>
<script id="land" type="application/octet-stream">__LAND_DATA__</script>
